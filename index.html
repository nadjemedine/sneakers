<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Brand | المتجر الفاخر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8f8f8;
            color: #1a1a1a;
        }

        .gold-text {
            color: #5f6266;
        }

        .gold-bg {
            background-color: #5f6266;
        }

        .gold-border {
            border-color: #5f6266;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .product-card {
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        input,
        select {
            background-color: #fff !important;
            color: #000 !important;
            border: 1px solid #ddd !important;
        }

        input:focus,
        select:focus {
            border-color: #5f6266 !important;
            box-shadow: 0 0 0 2px rgba(95, 98, 102, 0.1) !important;
        }

        .cart-item {
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-[#5f6266]/20 py-3 px-6 shadow-sm">
        <div class="flex justify-center">
            <img src="logo.png" alt="Logo" class="h-14 object-contain"
                onerror="this.outerHTML='<h1 class=\'text-2xl font-black gold-text\'>CLOTHING BRAND</h1>'">
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">

        <!-- Store Tab -->
        <section id="store-tab" class="tab-content active">
            <div class="mb-8 text-center">
                <h2 class="text-3xl font-black mb-2 uppercase tracking-widest text-zinc-900">منتجاتنا</h2>
                <div class="h-0.5 w-24 gold-bg mx-auto"></div>
            </div>

            <div id="products-grid" class="grid grid-cols-2 gap-3 md:gap-6">
                <!-- Products will be injected here -->
            </div>
        </section>

        <!-- Cart Tab -->
        <section id="cart-tab" class="tab-content">
            <h2 class="text-2xl font-black mb-8 border-r-4 gold-border pr-4 text-zinc-900">سلة المشتريات</h2>

            <div id="cart-empty" class="text-center py-20 bg-white rounded-3xl border border-zinc-200 hidden">
                <i data-lucide="shopping-cart" class="w-16 h-16 text-zinc-200 mx-auto mb-4"></i>
                <p class="text-zinc-400 mb-8">سلتك لا تزال فارغة</p>
                <button onclick="showTab('store')"
                    class="gold-bg text-white px-10 py-3 rounded-xl font-black text-sm">ابدأ التسوق</button>
            </div>

            <div id="cart-full" class="space-y-8">
                <div id="cart-items" class="space-y-4">
                    <!-- Items go here -->
                </div>

                <!-- COD Form -->
                <form id="order-form" class="bg-white p-6 rounded-3xl border border-zinc-100 shadow-xl space-y-5">
                    <div class="flex items-center gap-3 mb-2 gold-text">
                        <i data-lucide="map-pin"></i>
                        <h3 class="font-black text-lg">معلومات الطلب (الدفع عند الاستلام)</h3>
                    </div>

                    <div class="grid gap-4">
                        <input required type="text" id="cust-name" placeholder="الاسم الكامل"
                            class="w-full rounded-xl py-4 px-5 text-sm outline-none">
                        <input required type="tel" id="cust-phone" placeholder="رقم الهاتف" dir="ltr"
                            class="w-full rounded-xl py-4 px-5 text-sm outline-none text-right">

                        <div class="grid grid-cols-2 gap-4">
                            <select id="cust-wilaya"
                                class="w-full rounded-xl py-4 px-5 text-sm outline-none appearance-none cursor-pointer">
                                <!-- Wilayas injected here -->
                            </select>
                            <input required type="text" id="cust-commune" placeholder="البلدية"
                                class="w-full rounded-xl py-4 px-5 text-sm outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-4">
                        <div id="btn-home" onclick="setDelivery('home')"
                            class="flex flex-col items-center p-4 rounded-2xl border-2 gold-border bg-[#5f6266]/5 cursor-pointer transition-all">
                            <i data-lucide="home" class="gold-text mb-2"></i>
                            <span class="text-xs font-bold text-zinc-800">توصيل للمنزل</span>
                            <span id="price-home" class="text-[10px] text-zinc-500">--- د.ج</span>
                        </div>
                        <div id="btn-desk" onclick="setDelivery('desk')"
                            class="flex flex-col items-center p-4 rounded-2xl border-2 border-zinc-100 bg-zinc-50 opacity-60 cursor-pointer transition-all">
                            <i data-lucide="building" class="mb-2 text-zinc-400"></i>
                            <span class="text-xs font-bold text-zinc-800">توصيل للمكتب</span>
                            <span id="price-desk" class="text-[10px] text-zinc-500">--- د.ج</span>
                        </div>
                    </div>

                    <div class="bg-zinc-50 p-6 rounded-2xl space-y-3 mt-6 border border-zinc-100">
                        <div class="flex justify-between text-sm text-zinc-500">
                            <span>سعر السلع</span>
                            <span id="summary-subtotal" class="text-zinc-800 font-bold">0 د.ج</span>
                        </div>
                        <div class="flex justify-between text-sm text-zinc-500">
                            <span>سعر التوصيل</span>
                            <span id="summary-delivery" class="text-zinc-800 font-bold">0 د.ج</span>
                        </div>
                        <div
                            class="flex justify-between text-xl font-black text-zinc-900 pt-4 border-t border-zinc-200">
                            <span>الإجمالي</span>
                            <span id="summary-total" class="gold-text">0 د.ج</span>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full gold-bg hover:brightness-110 text-white font-black py-5 rounded-2xl mt-4 shadow-lg transition-all flex justify-center items-center gap-3 active:scale-95">
                        <i data-lucide="phone"></i>
                        تأكيد الطلب عبر واتساب
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Product Details Modal -->
    <div id="product-modal"
        class="fixed inset-0 z-[100] hidden flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/60 backdrop-blur-sm transition-opacity">
        <div
            class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300">
            <div class="relative h-80 sm:h-96">
                <button onclick="closeModal()"
                    class="absolute top-4 left-4 z-10 bg-white/80 p-2 rounded-full shadow-lg">
                    <i data-lucide="x" class="w-6 h-6 text-zinc-900"></i>
                </button>
                <img id="modal-img" src="" class="w-full h-full object-cover">
            </div>
            <div class="p-6 space-y-6">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 id="modal-title" class="text-2xl font-black text-zinc-900"></h2>
                        <p id="modal-price" class="text-xl font-black gold-text mt-1"></p>
                    </div>
                </div>

                <div class="space-y-3">
                    <p class="text-sm font-bold text-zinc-500">المقاسات المتوفرة:</p>
                    <div id="modal-sizes" class="flex flex-wrap gap-2">
                        <!-- Sizes Injected -->
                    </div>
                </div>

                <div class="pt-4 border-t border-zinc-100 flex gap-4">
                    <button id="modal-add-btn"
                        class="flex-grow gold-bg text-white py-4 rounded-xl font-black shadow-lg shadow-[#5f6266]/20 transition-all active:scale-95">
                        إضافة إلى السلة
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav
        class="fixed bottom-0 w-full bg-white/95 backdrop-blur-xl border-t border-zinc-100 z-50 shadow-[0_-4px_15px_rgba(0,0,0,0.03)]">
        <div class="max-w-lg mx-auto flex justify-around">
            <button onclick="showTab('store')"
                class="flex-1 py-4 flex flex-col items-center gap-1 transition-all text-black" id="nav-store">
                <i data-lucide="store" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold">المتجر</span>
            </button>
            <button onclick="showTab('cart')"
                class="flex-1 py-4 flex flex-col items-center gap-1 transition-all text-zinc-400 relative"
                id="nav-cart">
                <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                <span id="cart-count"
                    class="absolute top-2 right-1/3 bg-black text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                <span class="text-[10px] font-bold">السلة</span>
            </button>
        </div>
    </nav>

    <script>
        // Data
        const products = [
            { id: 1, name: "Tn Original", price: 38000, img: "image1.png", sizes: ["39", "40", "41", "42", "43", "44"] },
            { id: 2, name: "Tn Original", price: 37000, img: "image2.png", sizes: ["39", "40", "41", "42", "43", "44"] },
            { id: 3, name: "Tn Original", price: 37500, img: "image3.png", sizes: ["39", "40", "41", "42", "43", "44"] },
            { id: 4, name: "Tn Original", price: 36500, img: "image4.png", sizes: ["39", "40", "41", "42", "43", "44"] }
        ];

        const wilayas = [
            { id: "01", name: "أدرار", desk: 800, home: 1200 }, { id: "02", name: "الشلف", desk: 400, home: 600 },
            { id: "03", name: "الأغواط", desk: 500, home: 700 }, { id: "04", name: "أم البواقي", desk: 400, home: 600 },
            { id: "05", name: "باتنة", desk: 400, home: 600 }, { id: "06", name: "بجاية", desk: 400, home: 600 },
            { id: "07", name: "بسكرة", desk: 500, home: 700 }, { id: "08", name: "بشار", desk: 600, home: 900 },
            { id: "09", name: "البليدة", desk: 300, home: 500 }, { id: "10", name: "البويرة", desk: 400, home: 600 },
            { id: "16", name: "الجزائر", desk: 300, home: 400 }, { id: "19", name: "سطيف", desk: 400, home: 600 },
            { id: "31", name: "وهران", desk: 350, home: 500 }, { id: "25", name: "قسنطينة", desk: 400, home: 600 }
            // سيتم تعبئة البقية آلياً للنموذج
        ];
        // تكميل الـ 58 ولاية افتراضياً
        for (let i = 1; i <= 58; i++) {
            let code = i.toString().padStart(2, '0');
            if (!wilayas.find(w => w.id === code)) {
                wilayas.push({ id: code, name: "ولاية " + code, desk: 500, home: 750 });
            }
        }
        wilayas.sort((a, b) => a.id - b.id);

        let cart = [];
        let deliveryType = 'home';
        let selectedSizeModal = null;
        const WHATSAPP_NUM = "213563413607";

        // Functions
        function init() {
            lucide.createIcons();
            renderProducts();
            renderWilayas();
            updateUI();
            showTab('store');
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(p => `
                <div onclick="openModal(${p.id})" class="product-card rounded-2xl overflow-hidden flex flex-col group cursor-pointer transition-transform active:scale-95">
                    <div class="relative pt-[125%] bg-zinc-50 overflow-hidden">
                        <img src="${p.img}" class="absolute top-0 left-0 w-full h-full object-cover">
                    </div>
                    <div class="p-4 flex flex-col flex-grow items-center text-center">
                        <h3 class="text-sm font-bold text-zinc-900 mb-1">${p.name}</h3>
                        <p class="text-zinc-500 font-bold text-sm">${p.price.toLocaleString()} د.ج</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function openModal(id) {
            const p = products.find(x => x.id === id);
            selectedSizeModal = p.sizes[0];
            document.getElementById('modal-img').src = p.img;
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-price').innerText = p.price.toLocaleString() + " د.ج";

            renderModalSizes(p.sizes);

            document.getElementById('modal-add-btn').onclick = () => {
                addToCart(p.id, selectedSizeModal);
                closeModal();
            };

            document.getElementById('product-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function renderModalSizes(sizes) {
            const sizesDiv = document.getElementById('modal-sizes');
            sizesDiv.innerHTML = sizes.map(s => `
                <div onclick="selectSize('${s}', this)" class="size-option px-4 py-2 border ${selectedSizeModal === s ? 'border-black bg-black text-white' : 'border-zinc-200 text-zinc-700'} rounded-lg text-sm font-bold cursor-pointer transition-all">
                    ${s}
                </div>
            `).join('');
        }

        function selectSize(size, el) {
            selectedSizeModal = size;
            document.querySelectorAll('.size-option').forEach(opt => {
                opt.classList.remove('border-black', 'bg-black', 'text-white');
                opt.classList.add('border-zinc-200', 'text-zinc-700');
            });
            el.classList.add('border-black', 'bg-black', 'text-white');
            el.classList.remove('border-zinc-200', 'text-zinc-700');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function renderWilayas() {
            const select = document.getElementById('cust-wilaya');
            select.innerHTML = wilayas.map(w => `<option value="${w.id}">${w.id} - ${w.name}</option>`).join('');
            select.value = "16";
            select.onchange = updateUI;
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');

            document.getElementById('nav-store').classList.remove('text-black', 'text-zinc-400');
            document.getElementById('nav-cart').classList.remove('text-black', 'text-zinc-400');

            if (tab === 'store') {
                document.getElementById('nav-store').classList.add('text-black');
                document.getElementById('nav-cart').classList.add('text-zinc-400');
            } else {
                document.getElementById('nav-cart').classList.add('text-black');
                document.getElementById('nav-store').classList.add('text-zinc-400');
            }
            window.scrollTo(0, 0);
        }

        function addToCart(id, size) {
            const prod = products.find(p => p.id === id);
            const inCart = cart.find(i => i.id === id && i.size === size);
            if (inCart) inCart.qty++;
            else cart.push({ ...prod, qty: 1, size: size });
            updateUI();

            // Notification or visual hint
            const badge = document.getElementById('cart-count');
            badge.classList.add('scale-150');
            setTimeout(() => badge.classList.remove('scale-150'), 200);
        }

        function updateQty(id, size, delta) {
            const item = cart.find(i => i.id === id && i.size === size);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => !(i.id === id && i.size === size));
            }
            updateUI();
        }

        function setDelivery(type) {
            deliveryType = type;
            updateUI();
        }

        function updateUI() {
            // Badge
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);
            const badge = document.getElementById('cart-count');
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            // Cart Contents
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                document.getElementById('cart-empty').classList.remove('hidden');
                document.getElementById('cart-full').classList.add('hidden');
            } else {
                document.getElementById('cart-empty').classList.add('hidden');
                document.getElementById('cart-full').classList.remove('hidden');
                container.innerHTML = cart.map(item => `
                    <div class="flex gap-4 bg-white p-3.5 rounded-2xl border border-zinc-100 items-center shadow-sm">
                        <img src="${item.img}" class="w-16 h-16 object-cover rounded-xl bg-zinc-50 border border-zinc-100">
                        <div class="flex-grow">
                            <h4 class="font-bold text-xs text-zinc-900 mb-0.5">${item.name}</h4>
                            <p class="text-[10px] text-zinc-400 mb-1">المقاس: ${item.size}</p>
                            <p class="text-zinc-900 text-sm font-black">${item.price.toLocaleString()} د.ج</p>
                            <div class="flex items-center gap-4 mt-2">
                                <button onclick="updateQty(${item.id}, '${item.size}', -1)" class="w-7 h-7 rounded-full bg-zinc-100 flex items-center justify-center text-zinc-400"><i data-lucide="minus" class="w-3 h-3"></i></button>
                                <span class="text-xs font-bold">${item.qty}</span>
                                <button onclick="updateQty(${item.id}, '${item.size}', 1)" class="w-7 h-7 rounded-full bg-zinc-100 flex items-center justify-center text-black"><i data-lucide="plus" class="w-3 h-3"></i></button>
                            </div>
                        </div>
                        <button onclick="updateQty(${item.id}, '${item.size}', -${item.qty})" class="text-zinc-200 p-2"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                    </div>
                `).join('');
                lucide.createIcons();
            }

            // Calculations
            const wId = document.getElementById('cust-wilaya').value;
            const wObj = wilayas.find(w => w.id === wId);
            const sub = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            const delPrice = wObj ? wObj[deliveryType] : 0;

            document.getElementById('price-home').innerText = wObj.home + " د.ج";
            document.getElementById('price-desk').innerText = wObj.desk + " د.ج";
            document.getElementById('summary-subtotal').innerText = sub.toLocaleString() + " د.ج";
            document.getElementById('summary-delivery').innerText = delPrice.toLocaleString() + " د.ج";
            document.getElementById('summary-total').innerText = (sub + delPrice).toLocaleString() + " د.ج";

            // Delivery Toggle Style
            const bHome = document.getElementById('btn-home');
            const bDesk = document.getElementById('btn-desk');
            if (deliveryType === 'home') {
                bHome.className = "flex flex-col items-center p-4 rounded-2xl border-2 gold-border bg-[#5f6266]/10 cursor-pointer transition-all";
                bDesk.className = "flex flex-col items-center p-4 rounded-2xl border-2 border-zinc-100 bg-zinc-50 opacity-60 cursor-pointer transition-all";
                bHome.querySelector('i').className = "gold-text mb-2";
                bDesk.querySelector('i').className = "mb-2 text-zinc-400";
            } else {
                bHome.className = "flex flex-col items-center p-4 rounded-2xl border-2 border-zinc-100 bg-zinc-50 opacity-60 cursor-pointer transition-all";
                bDesk.className = "flex flex-col items-center p-4 rounded-2xl border-2 gold-border bg-[#5f6266]/10 cursor-pointer transition-all";
                bHome.querySelector('i').className = "mb-2 text-zinc-400";
                bDesk.querySelector('i').className = "gold-text mb-2";
            }
        }

        // Send Order
        document.getElementById('order-form').onsubmit = function (e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const wId = document.getElementById('cust-wilaya').value;
            const wName = wilayas.find(w => w.id === wId).name;
            const comm = document.getElementById('cust-commune').value;

            let itemsText = cart.map(i => `• ${i.name} (مقاس ${i.size}) x${i.qty} = ${i.price * i.qty} دج`).join('%0A');

            let message = `*🛍️ طلب جديد من متجر Clothing Brand*%0A`;
            message += `----------------------------%0A`;
            message += `*👤 الزبون:* ${name}%0A`;
            message += `*📱 الهاتف:* ${phone}%0A`;
            message += `*📍 الولاية:* ${wName} (${wId})%0A`;
            message += `*🏘️ البلدية:* ${comm}%0A`;
            message += `*🚚 نوع التوصيل:* ${deliveryType === 'home' ? 'للمنزل' : 'للمكتب'}%0A`;
            message += `----------------------------%0A`;
            message += `*📦 السلع:*%0A${itemsText}%0A`;
            message += `----------------------------%0A`;
            message += `*💰 الإجمالي الصافي:* *${document.getElementById('summary-total').innerText}*`;

            window.open(`https://wa.me/${WHATSAPP_NUM}?text=${message}`, '_blank');
        };

        window.onload = init;
    </script>
</body>

</html>
